# lightning.pytorch==2.6.6
seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: lightning_logs/gan/fashion
      name: featmatch_smalld
      version: null
      log_graph: false
      default_hp_metric: false
      prefix: ''
      sub_dir: null
      comment: ''
      purge_step: null
      max_queue: 10
      flush_secs: 120
      filename_suffix: ''
  callbacks:
  - class_path: lgm.callbacks.FitInfo
    init_args:
      image_size: 1
      colormap: Greys
      n_rows: 8
      n_cols: 16
  - class_path: lgm.callbacks.HyperParamLogger
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: null
      log_momentum: false
      log_weight_decay: false
  - class_path: lightning.pytorch.callbacks.ModelSummary
    init_args:
      max_depth: 2
  - class_path: lgm.callbacks.GenerationLogging
    init_args:
      config:
        every_n_epochs: 10
        image_size: 1.5
        n_rows: 10
        colormap: Greys
      seed: 12
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: '{epoch}'
      monitor: null
      verbose: false
      save_last: true
      save_top_k: 1
      save_on_exception: false
      save_weights_only: false
      mode: min
      auto_insert_metric_name: true
      every_n_train_steps: null
      train_time_interval: null
      every_n_epochs: 1
      save_on_train_epoch_end: null
      enable_version_counter: true
  fast_dev_run: false
  max_epochs: 100
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: 100
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: true
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  enable_autolog_hparams: true
  model_registry: null
model:
  class_path: lgm.models.gan.GANTrainingModuleParallel
  init_args:
    model:
      class_path: lgm.models.gan.GAN
      init_args:
        discriminator:
          class_path: lgm.models.gan.Discriminator
          init_args:
            config:
              input_shape:
              - 1
              - 32
              - 32
              out_dim: 1
              head_style: pool-fc
              body_config:
                blocks_per_level:
                - 2
                - 2
                - 1
                level_filters:
                - 32
                - 64
                - 128
                level_strides: null
                level_attentions: null
                final_normact: true
                level_residual: false
              block_config:
                data_format: 2d
                n_layers: 2
                kernel_size: 3
                activation: torch.nn.Mish
                bottleneck_factor: 1
                depthwise: false
                norm: group
                norm_groups: 16
                use_residual: true
                force_1x1: false
                rescale_residual: false
                zero_init: false
                use_se: true
                se_reduction_factor: 8
                se_bias: 2.0
                dropout: 0.0
              input_skips: false
              return_all: true
              global_dropout: 0.0
            sd_layer: false
        generator:
          class_path: lgm.models.gan.Generator
          init_args:
            config:
              input_shape:
              - 1
              - 32
              - 32
              latent_dim: 64
              root_style: fc
              body_config:
                blocks_per_level:
                - 1
                - 1
                - 2
                - 2
                level_filters:
                - 256
                - 128
                - 64
                - 32
                level_strides:
                - 2
                - 2
                - 2
                - 1
                level_attentions: null
                final_normact: true
                level_residual: false
              block_config:
                data_format: 2d
                n_layers: 2
                kernel_size: 3
                activation: torch.nn.Mish
                bottleneck_factor: 1
                depthwise: false
                norm: batch
                norm_groups: null
                use_residual: true
                force_1x1: false
                rescale_residual: false
                zero_init: false
                use_se: true
                se_reduction_factor: 8
                se_bias: 2.0
                dropout: 0.0
              output_skips: false
            noise_distribution:
              class_path: torch.distributions.Normal
              init_args:
                loc: 0.0
                scale: 1.0
                validate_args: null
    optimization_config:
      optimizer:
        class_path: lgm.optimizers.AdamWConfig
        init_args:
          lr: 0.0002
          weight_decay: 0.0
          betas:
          - 0.5
          - 0.999
          eps: 1.0e-08
          amsgrad: false
      scheduler:
        class_path: lgm.optimizers.CosineWarmupConfig
        init_args:
          warmup_fraction: 0.05
    d_loss_fn:
      class_path: torch.nn.MSELoss
      init_args:
        size_average: null
        reduce: null
        reduction: mean
    feature_matching: 10.0
    label_smoothing: 0.0
data:
  class_path: lgm.data.ImageDataModule
  init_args:
    dataset: fashion
    batch_size: 128
    num_workers: 2
    persistent_workers: true
    root: data
    resize: null
    normalize: null
    augment_transforms: null
    additional_transforms: null
    no_flip: false
    cutmixup: null
compile: false
matmul_high: true
optimizer: null
lr_scheduler: null
ckpt_path: null
weights_only: null
